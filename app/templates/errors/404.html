{% extends "base.html" %}
{% block title %}{{ t("errors.404_title") }} – {{ site_name }}{% endblock %}
{% block content %}
<div class="container-page max-w-xl py-20 text-center">
  <p class="text-6xl font-extrabold text-gold-500" aria-hidden="true">404</p>
  <h1 class="mt-4 text-2xl font-extrabold">{{ t("errors.404_title") }}</h1>
  <p class="mt-2 text-stone-600 dark:text-stone-400">{{ t("errors.404_text") }}</p>
  <a class="btn-primary mt-6" href="{{ url_for('public.home') }}">{{ t("errors.back_home") }}</a>
</div>
{% endblock %}
