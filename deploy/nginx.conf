# /etc/nginx/sites-available/amberg-live
# Replace amberg-live.de with your domain. Certificates come from certbot (see DEPLOYMENT.md).

server {
    listen 80;
    listen [::]:80;
    server_name amberg-live.de www.amberg-live.de;
    # certbot renews via this path; everything else goes to https
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://amberg-live.de$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.amberg-live.de;
    ssl_certificate     /etc/letsencrypt/live/amberg-live.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amberg-live.de/privkey.pem;
    return 301 https://amberg-live.de$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name amberg-live.de;

    ssl_certificate     /etc/letsencrypt/live/amberg-live.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/amberg-live.de/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Uploads up to MAX_UPLOAD_MB (8) plus form overhead
    client_max_body_size 10m;

    # Privacy: no IP addresses in nginx access logs (the app logs failed logins itself).
    access_log off;
    error_log /var/log/nginx/amberg-live.error.log warn;

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml text/plain application/xml;
    gzip_min_length 1024;

    # Static files: URLs carry ?v=<hash>, so they may be cached for a year.
    location /static/ {
        alias /srv/amberg-live/app/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff;
        access_log off;
    }

    # Uploaded images (always WebP, random names). Never executed, never sniffed.
    location /uploads/ {
        alias /srv/amberg-live/instance/uploads/;
        expires 30d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options nosniff;
        add_header Content-Security-Policy "default-src 'none'";
        location ~ \.(?!webp$)[^.]+$ { return 404; }
    }

    # The service worker must not be cached by the browser for long.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/proxy_params;
        add_header Cache-Control "no-cache";
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_read_timeout 30s;
    }
}
